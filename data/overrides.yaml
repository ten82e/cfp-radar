# 上流データの訂正と除外。scripts/merge.py の apply_overrides() が読む。
#
# 収録範囲の方針(サブ分野丸ごと + 例外)は config.yaml の taxonomy / exclude が担う。
# ここは「上流の値そのものが誤っている」場合の局所的な訂正にだけ使う。
#
# 形:
#   aliases: {<別名 key>: <正規 key>, ...}  名寄せ(merge の前に key を書き換える)
#   drop: [<会議 key>, ...]                 収録から完全に外す
#   conferences:
#     <会議 key>:
#       title / full_name / link / dblp / upstream_sub: 上書き(スカラー)
#       rank: {ccf: A, ...}                 既存 rank にマージ
#       tags / categories: [...]            置き換え
#       editions:
#         <年(整数)>:
#           drop: true                      その版を落とす
#           link / place / date_text: 上書き
#           event_start / event_end: 'YYYY-MM-DD' もしくは null
#
# 上流の日付が誤っていた場合は、必ず公式サイトで裏を取ってから書く。
# 推測値をここに入れない(SPEC.md 9. 非目標)。
#
# IMC 2026 の会期は公式サイトで 10/12-16 に更新済み。上流の 11/3-6 をここで正す。

# ccfddl と hf で同じ会議が別 title になっている組(SPEC.md 3.1 で確認済みの 3 組)。
# 左が hf 側の slug、右が ccfddl 側の正規キー。
aliases:
  kdd: sigkdd
  siggraph: acm-siggraph
  cec: ieee-cec

drop: []

conferences:
  # 根拠: https://conferences.sigcomm.org/imc/2026/ (2026-08-09 取得)
  #   「ACM IMC 2026 conference will be held from October 12-16, 2026 in Karlsruhe, Germany」
  #   上流 ccfddl NW/imc.yml は date: November 03-06, 2026 のまま（会期更新が未反映）。
  imc:
    editions:
      2026:
        date_text: October 12-16, 2026
        event_start: '2026-10-12'
        event_end: '2026-10-16'
        place: Karlsruhe, Germany


  # 根拠: https://kdd2027.kdd.org/ (2026-08-09 取得)
  #   「August 1–5, 2027 San Jose McEnery Convention Center」。
  #   上流は August 2027 (exact dates TBD) → 月のみ 08-01..08-31。
  sigkdd:
    editions:
      2027:
        date_text: August 1-5, 2027
        event_start: '2027-08-01'
        event_end: '2027-08-05'
        place: San Jose McEnery Convention Center, San Jose, California, USA
        link: https://kdd2027.kdd.org/

  # 根拠: https://iui.acm.org/2027/ — 会議トップが 2026 のまま残っていた。
  iui:
    link: https://iui.acm.org/2027/
    editions:
      2027:
        link: https://iui.acm.org/2027/

  # 根拠: https://asiaccs2027.cityu.edu.mo/index.html
  asiaccs:
    link: https://asiaccs2027.cityu.edu.mo/index.html
    editions:
      2027:
        link: https://asiaccs2027.cityu.edu.mo/index.html
