# 上流データの訂正と除外。scripts/merge.py の apply_overrides() が読む。
#
# 収録範囲の方針(サブ分野丸ごと + 例外)は config.yaml の taxonomy / exclude が担う。
# ここは「上流の値そのものが誤っている」場合の局所的な訂正にだけ使う。
#
# 形:
#   aliases: {<別名 key>: <正規 key>, ...}  名寄せ(merge の前に key を書き換える)
#   drop: [<会議 key>, ...]                 収録から完全に外す
#   conferences:
#     <会議 key>:
#       title / full_name / link / dblp / upstream_sub: 上書き(スカラー)
#       rank: {ccf: A, ...}                 既存 rank にマージ
#       tags / categories: [...]            置き換え
#       editions:
#         <年(整数)>:
#           drop: true                      その版を落とす
#           link / place / date_text: 上書き
#           event_start / event_end: 'YYYY-MM-DD' もしくは null
#           deadlines: [...]                その版の締切を置換 (extra.yaml と同形式。
#                                            延長・訂正用。drop と違い rollforward の
#                                            推定再生成を誘発しない)
#
# 上流の日付が誤っていた場合は、必ず公式サイトで裏を取ってから書く。
# 推測値をここに入れない(SPEC.md 9. 非目標)。
#
# IMC 2026 の会期は公式サイトで 10/12-16 に更新済み。上流の 11/3-6 をここで正す。

# ccfddl と hf で同じ会議が別 title になっている組(SPEC.md 3.1 で確認済みの 3 組)。
# 左が hf 側の slug、右が ccfddl 側の正規キー。
aliases:
  kdd: sigkdd
  siggraph: acm-siggraph
  cec: ieee-cec

drop: []

conferences:
  # 根拠: https://www.mmm2027.net/ (2026-08-10 取得)「Paper Submission Deadline
  #   Extended: 16 Aug → 30 Aug 2026」「All deadlines refer to 23:59 on the specified
  #   day in the Anywhere on Inhabited Earth (AOE) time zone」。上流 ccfddl は延長前の
  #   8/16 AoE のまま → deadlines 置換で延長後を正とする (drop は rollforward が
  #   推定を再生成するため不可)。会期 January 5-8, 2027 Siem Reap, Cambodia。
  mmm:
    editions:
      2027:
        link: https://www.mmm2027.net/
        place: Siem Reap, Cambodia
        date_text: 'January 5-8, 2027'
        deadlines:
          - {kind: paper, label: 'Regular/special paper submission (extended)', date: '2026-08-30 23:59:00', tz: AoE}
          - {kind: other, label: 'Demo paper submission', date: '2026-09-07 23:59:00', tz: AoE}

  # 根拠: https://www.mmasia2026.org/ (2026-08-10 取得) — 公式「Submission
  #   Deadline: August 14, 2026 (AoE)」(Regular Paper。8/3 → 8/14 に延長済み)。
  #   上流 ccfddl は Regular Paper / Special Session を 8/14 1 本にまとめているが、
  #   公式は Special Session Paper 8/21 AoE・Demo / Industry 9/1 AoE を別途明記。
  mmasia:
    editions:
      2026:
        deadlines:
          - {kind: paper, label: 'Regular paper submission', date: '2026-08-14 23:59:00', tz: AoE}
          - {kind: paper, label: 'Special session paper submission', date: '2026-08-21 23:59:00', tz: AoE}
          - {kind: other, label: 'Demo / industry submission', date: '2026-09-01 23:59:00', tz: AoE}

  # 根拠: https://conferences.sigcomm.org/imc/2026/ (2026-08-09 取得)
  #   「ACM IMC 2026 conference will be held from October 12-16, 2026 in Karlsruhe, Germany」
  #   上流 ccfddl NW/imc.yml は date: November 03-06, 2026 のまま（会期更新が未反映）。
  imc:
    editions:
      2026:
        date_text: October 12-16, 2026
        event_start: '2026-10-12'
        event_end: '2026-10-16'
        place: Karlsruhe, Germany


  # 根拠: https://kdd2027.kdd.org/ (2026-08-09 取得)
  #   「August 1–5, 2027 San Jose McEnery Convention Center」。
  #   上流は August 2027 (exact dates TBD) → 月のみ 08-01..08-31。
  sigkdd:
    editions:
      2027:
        date_text: August 1-5, 2027
        event_start: '2027-08-01'
        event_end: '2027-08-05'
        place: San Jose McEnery Convention Center, San Jose, California, USA
        link: https://kdd2027.kdd.org/

  # 根拠: https://iui.acm.org/2027/ — 会議トップが 2026 のまま残っていた。
  iui:
    link: https://iui.acm.org/2027/
    editions:
      2027:
        link: https://iui.acm.org/2027/

  # 根拠: https://asiaccs2027.cityu.edu.mo/index.html
  asiaccs:
    link: https://asiaccs2027.cityu.edu.mo/index.html
    editions:
      2027:
        link: https://asiaccs2027.cityu.edu.mo/index.html

  # 根拠: EuroVis 2026 の公式 important dates (eurovis.org.uk/important-dates, Wayback 2025-11-11)。
  #   abstract 2025-11-27 が正しい一方、上流 ccfddl の paper 2024-12-04 は 2025 版の
  #   締切が混入した誤り (2026 版の paper 締切は 2025 年 12 月初旬の公算だが未裏取り)。
  #   誤データを含む 2026 edition を落とすと rollforward は eurovis27-est を正しく
  #   2026 年 12 月に作る (2024-12 起点だと 2 年飛ばして eurovis28-est を作っていた)。
  eurovis:
    editions:
      2026:
        drop: true

  # 根拠: https://acns2027.isg.rhul.ac.uk/ (2026-08-12 取得)
  #   「Submission deadline: 24 September 2026 AoE」(Cycle 1)
  #   「Submission deadline: 21 January 2027 AoE」(Cycle 2)
  #   会期 28 June – 1 July 2027 @ Windsor Building, Royal Holloway (Egham, UK)。
  #   上流 ccfddl は 2027 を 2026 版からの推定 (10/31, 2/27) のまま → deadlines 置換で
  #   公式値を正とする。
  acns:
    editions:
      2027:
        link: https://acns2027.isg.rhul.ac.uk/
        place: Royal Holloway, Egham, UK
        date_text: 'June 28 - July 1, 2027'
        event_start: '2027-06-28'
        event_end: '2027-07-01'
        deadlines:
          - {kind: paper, label: 'Cycle 1 paper submission', date: '2026-09-24 23:59:00', tz: AoE}
          - {kind: paper, label: 'Cycle 2 paper submission', date: '2027-01-21 23:59:00', tz: AoE}

  # 根拠: https://fse.iacr.org/2027/ (2026-08-12 取得)
  #   「1 Sep 2026: ToSC 2026 issue 4 submission date」「1 Dec 2026: ToSC 2027 issue 1
  #   submission date」、会期 24-28 May 2027 @ Maastricht, Netherlands。
  #   タイムゾーンは https://tosc.iacr.org/ 「The deadline for Volume ... is <date>
  #   23:59 AoE」で AoE 明記 (2026-08-12 取得)。
  #   上流 ccfddl conference/SC/fse.yml は 2026 までで 2027 版なし → 新規 edition として
  #   追加 (merge.ts patchEditions の year 追加パス)。
  fse:
    editions:
      2027:
        link: https://fse.iacr.org/2027/
        place: Maastricht, Netherlands
        date_text: 'May 24-28, 2027'
        event_start: '2027-05-24'
        event_end: '2027-05-28'
        deadlines:
          - {kind: paper, label: 'ToSC 2026 Issue 4 submission', date: '2026-09-01 23:59:59', tz: AoE}
          - {kind: paper, label: 'ToSC 2027 Issue 1 submission', date: '2026-12-01 23:59:59', tz: AoE}

  # 根拠: https://conf.researchr.org/home/issta-2027 (2026-08-12 取得)
  #   Round 1「Mandatory Abstract submission Mon 8 Jan 2027 / Full Paper
  #   submission Mon 11 Jan 2027」(researchr は AoE (UTC-12h) 明記)。
  #   会期 July 2027 @ Singapore（venue ページ確認。正確な日レンジは未公開のため month-only）。
  #   上流 ccfddl は 2026 まで → 2027 Round 1 を新規 edition で追加。
  issta:
    editions:
      2027:
        link: https://conf.researchr.org/home/issta-2027
        place: Singapore
        date_text: 'July 2027'
        deadlines:
          - {kind: abstract, label: 'Round 1 abstract submission', date: '2027-01-08 23:59:59', tz: AoE}
          - {kind: paper, label: 'Round 1 full paper submission', date: '2027-01-11 23:59:59', tz: AoE}

  # 根拠: https://www.ecir2027.co.uk/call-for-full-papers (2026-08-12 取得)
  #   「Authors have to first submit the abstract of their paper by September 21,
  #   2026, 11:59pm (GMT)」「Full paper submission: 5 October 2026」
  #   (calls トップの timeline も 21 SEPT / 5 Oct で一致)。
  #   上流 aideadlines は abstract 9/25・paper 10/2 を収録（ECIR 2026 の日付を
  #   引き写した疑い。2026 は公式 abstract 9/25・paper 10/2 だった）→ 訂正。
  ecir:
    editions:
      2027:
        deadlines:
          - {kind: abstract, label: 'Abstract submission', date: '2026-09-21 23:59:59', tz: GMT}
          - {kind: paper, label: 'Paper submission', date: '2026-10-05 23:59:59', tz: GMT}
