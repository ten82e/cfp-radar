name: discover-niche-venues

on:
  schedule:
    # 03:00 UTC every Sunday
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Discover niche venues and journals
        run: python -m scripts.cli discover --out data/discovered_candidates.yaml

      - name: Upload Discovered Candidates Artifact
        uses: actions/upload-artifact@v4
        with:
          name: discovered-niche-candidates
          path: data/discovered_candidates.yaml
