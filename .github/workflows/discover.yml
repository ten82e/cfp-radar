name: discover-niche-venues

on:
  schedule:
    # 03:00 UTC every Sunday
    - cron: '0 3 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover niche venues and journals
        run: node src/cli.ts discover --out data/discovered_candidates.yaml

      - name: Upload Discovered Candidates Artifact
        uses: actions/upload-artifact@v4
        with:
          name: discovered-niche-candidates
          path: data/discovered_candidates.yaml
