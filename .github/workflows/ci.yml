name: ci

on:
  push:
    paths-ignore:
      - 'data/snapshot.json'
  pull_request:
    paths-ignore:
      - 'data/snapshot.json'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run check

      - name: Run tests
        run: npm test

  # 実際の上流を取りに行く。上流障害で PR が赤くならないよう必須にしない。
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build against live upstream
        run: node src/cli.ts build --out /tmp/site --now 2026-08-09T00:00:00Z

      # 終了コードだけでは上流のスキーマ変更を検出できない(退避経路が働くと
      # 成功したまま件数だけ落ちる)ので、件数の下限を検査する。
      - name: Check the result is not degraded
        run: |
          node -e '
          const fs = require("node:fs");
          const data = JSON.parse(fs.readFileSync("/tmp/site/data.json", "utf8"));
          const n = data.conferences.length;
          console.log(`${n} conferences`);
          process.exit(n >= 150 ? 0 : 1);
          '
