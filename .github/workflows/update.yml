name: update

on:
  schedule:
    # 20:17 UTC = 05:17 JST（毎日）
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 一次ソースの自動抽出 (data/primary.yaml → data/primary_overrides.yaml)。
      # 抽出失敗の会議は前回値を維持するので、サイトが一時的に落ちていても安全。
      - name: Fetch primary sources
        run: node src/fetch-primary.ts --apply

      # 上流取得に失敗しても、コミット済み data/snapshot.json から生成を続ける
      # (SPEC.md 3.5)。推薦 bundle は後段で cache から復元・検証する。
      - name: Build deadline bundle
        id: build
        run: node src/cli.ts build --out public --no-embeddings

      - name: Compute recommendation bundle key
        id: recommendation-key
        run: |
          bundle_key=$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { embeddingBundleKey, embeddingProfileHash } from "./src/embeddings.ts"; const data = JSON.parse(readFileSync("public/data.json", "utf8")); process.stdout.write(embeddingBundleKey(embeddingProfileHash(data)));')
          echo "key=$bundle_key" >> "$GITHUB_OUTPUT"

      - name: Restore recommendation bundle
        id: restore-recommendation
        uses: actions/cache/restore@v4
        with:
          path: public/embeddings.json
          key: ${{ steps.recommendation-key.outputs.key }}

      - name: Generate recommendation bundle
        if: ${{ steps.restore-recommendation.outputs.cache-hit != 'true' }}
        run: node src/embeddings.ts public/data.json public/embeddings.json

      - name: Validate recommendation bundle
        id: validate-recommendation
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { embeddingsStale } from "./src/build.ts";
          const data = JSON.parse(readFileSync("public/data.json", "utf8"));
          const embeddings = JSON.parse(readFileSync("public/embeddings.json", "utf8"));
          if (embeddingsStale(embeddings, data)) {
            throw new Error("recommendation bundle is missing or stale");
          }
          NODE

      # 公開済み health.json を last-known-good として、致命的なデータ縮退を
      # Pages artifact に載せる前に止める。初回公開や一時的な Pages 障害では
      # current report 単独の fail-closed 条件を検査する。
      - name: Health gate
        id: health-gate
        if: ${{ steps.validate-recommendation.outcome == 'success' }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 2 \
            'https://ten82e.github.io/kamiyobi/health.json' \
            -o /tmp/last-known-good-health.json || rm -f /tmp/last-known-good-health.json
          if [ -f /tmp/last-known-good-health.json ]; then
            node scripts/health-gate.ts public/health.json /tmp/last-known-good-health.json /tmp/next-last-known-good-health.json
          else
            node scripts/health-gate.ts public/health.json '' /tmp/next-last-known-good-health.json
          fi

      - name: Save recommendation bundle
        if: ${{ success() && steps.restore-recommendation.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: public/embeddings.json
          key: ${{ steps.recommendation-key.outputs.key }}

      # スナップショットは上流が変わった日にだけ更新される。
      # SPEC.md 6 のとおり、活動を偽装するハートビートコミットは実装しない。
      # snapshot と primary_overrides のどちらかに実質変更があるときだけ
      # 両方をコミットする（_comment の抽出日付の変化だけではコミットしない）。
      - name: Commit data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ ! -f data/snapshot.json ]; then
            echo 'no snapshot produced; nothing to commit'
            exit 0
          fi

          # 実質差分（generated_at / _comment は無視・キー順序は正規化）を
          # HEAD と比較し、どちらかが変わっていれば両方コミットする。
          snap_changed=$(node scripts/compare-head.ts data/snapshot.json)
          primary_changed=$(node scripts/compare-head.ts data/primary_overrides.yaml)

          if [ "$snap_changed" != '1' ] && [ "$primary_changed" != '1' ]; then
            echo 'no substantive change; nothing to commit'
            exit 0
          fi

          git add data/snapshot.json data/primary_overrides.yaml
          git commit -m 'chore: update deadline data [skip ci]'
          # 実行中に人手のコミットが入ると非 fast-forward で弾かれるので、
          # 取り込んでから押し直す。
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/${GITHUB_REF_NAME}"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          done
          echo 'could not push the deadline data' >&2
          exit 1

      # 配信は build・recommendation 検証・health gate の成否で決める。
      # データ commit/push の失敗でその日の配信ごと落とさない。
      - name: Upload Pages artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.validate-recommendation.outcome == 'success' && steps.health-gate.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.validate-recommendation.outcome == 'success' && steps.health-gate.outcome == 'success' }}
        uses: actions/deploy-pages@v5

  # 外部 CFP ソース (wikiCFP / DBLP / OpenReview) から新規会議候補を集め、
  # data/discovered_candidates.yaml に永続マージする。収録(snapshot/サイト)には
  # 影響しない。候補を extra.yaml に昇格するときは公式サイトで締切を裏取り
  # する(SPEC.md 3.7 の原則)。
  discover-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover candidates
        env:
          # 任意: 購読メーリス (IMAP) を処理する場合は GitHub Secrets に設定する。
          # 未設定なら discover は IMAP をスキップする。
          CFP_IMAP_HOST: ${{ secrets.CFP_IMAP_HOST }}
          CFP_IMAP_USER: ${{ secrets.CFP_IMAP_USER }}
          CFP_IMAP_PASS: ${{ secrets.CFP_IMAP_PASS }}
        run: |
          node src/cli.ts discover \
            --candidate-out data/discovered_candidates.yaml || echo 'discovery failed; keeping previous candidates'

      - name: Commit candidates
        run: |
          set -euo pipefail
          if ! git diff --quiet -- data/discovered_candidates.yaml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/discovered_candidates.yaml
            git commit -m 'chore: refresh discovered candidates [skip ci]'
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "push rejected (attempt ${attempt}); rebasing onto origin/${GITHUB_REF_NAME}"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            done
            echo 'could not push the candidates' >&2
            exit 1
          fi
          echo 'no new candidates; nothing to commit'
