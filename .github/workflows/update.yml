name: update

on:
  schedule:
    # 20:17 UTC = 05:17 JST（毎日）
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 一次ソースの自動抽出 (data/primary.yaml → data/primary_overrides.yaml)。
      # 抽出失敗の会議は前回値を維持するので、サイトが一時的に落ちていても安全。
      - name: Fetch primary sources
        run: node src/fetch-primary.ts --apply

      # 上流取得に失敗しても、コミット済み data/snapshot.json から生成を続ける
      # (SPEC.md 3.5)。退避にも失敗したときは cli が非ゼロで終了し、後続の
      # Upload / Deploy がスキップされて前回の公開内容がそのまま残る。
      - name: Build
        id: build
        run: node src/cli.ts build --out public

      # スナップショットは上流が変わった日にだけ更新される。
      # SPEC.md 6 のとおり、活動を偽装するハートビートコミットは実装しない。
      # snapshot と primary_overrides のどちらかに実質変更があるときだけ
      # 両方をコミットする（_comment の抽出日付の変化だけではコミットしない）。
      - name: Commit data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if [ ! -f data/snapshot.json ]; then
            echo 'no snapshot produced; nothing to commit'
            exit 0
          fi

          # 実質差分（generated_at / _comment は無視・キー順序は正規化）を
          # HEAD と比較し、どちらかが変わっていれば両方コミットする。
          snap_changed=$(node scripts/compare-head.ts data/snapshot.json)
          primary_changed=$(node scripts/compare-head.ts data/primary_overrides.yaml)

          if [ "$snap_changed" != '1' ] && [ "$primary_changed" != '1' ]; then
            echo 'no substantive change; nothing to commit'
            exit 0
          fi

          git add data/snapshot.json data/primary_overrides.yaml
          git commit -m 'chore: update deadline data [skip ci]'
          # 実行中に人手のコミットが入ると非 fast-forward で弾かれるので、
          # 取り込んでから押し直す。
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt ${attempt}); rebasing onto origin/${GITHUB_REF_NAME}"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
          done
          echo 'could not push the deadline data' >&2
          exit 1

      # 配信はビルドの成否だけに依存させる。コミット/push の失敗で
      # その日の配信ごと落とさない。
      - name: Upload Pages artifact
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/deploy-pages@v4

  # 外部 CFP ソース (wikiCFP / DBLP / OpenReview) から新規会議候補を集め、
  # data/discovered_candidates.yaml に追記する。収録(snapshot/サイト)には
  # 影響しない。候補を extra.yaml に昇格するときは公式サイトで締切を裏取り
  # する(SPEC.md 3.7 の原則)。
  discover-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Discover candidates
        env:
          # 任意: 購読メーリス (IMAP) を処理する場合は GitHub Secrets に設定する。
          # 未設定なら discover は IMAP をスキップする。
          CFP_IMAP_HOST: ${{ secrets.CFP_IMAP_HOST }}
          CFP_IMAP_USER: ${{ secrets.CFP_IMAP_USER }}
          CFP_IMAP_PASS: ${{ secrets.CFP_IMAP_PASS }}
        run: |
          node src/cli.ts discover \
            --min-year 2026 \
            --out data/discovered_candidates.yaml \
            --append || echo 'discovery failed; keeping previous candidates'

      - name: Commit candidates
        run: |
          set -euo pipefail
          if ! git diff --quiet -- data/discovered_candidates.yaml; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/discovered_candidates.yaml
            git commit -m 'chore: refresh discovered candidates [skip ci]'
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "push rejected (attempt ${attempt}); rebasing onto origin/${GITHUB_REF_NAME}"
              git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            done
            echo 'could not push the candidates' >&2
            exit 1
          fi
          echo 'no new candidates; nothing to commit'
