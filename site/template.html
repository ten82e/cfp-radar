<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cfp-radar — CS国際会議・穴場ワークショップ全自動探知＆締切カレンダー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;600;700&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg-dark: #0a0d14;
  --bg-panel: rgba(18, 24, 38, 0.85);
  --bg-card: rgba(255, 255, 255, 0.03);
  --bg-card-hover: rgba(28, 36, 56, 0.9);
  --line: rgba(255, 255, 255, 0.12);
  --border-accent: rgba(99, 102, 241, 0.5);

  --accent: #38bdf8;
  --accent-purple: #818cf8;
  --accent-pink: #f472b6;
  --accent-emerald: #34d399;
  --accent-amber: #fbbf24;
  --warn: #fb7185;
  --soon: #fbbf24;
  --chip: rgba(255, 255, 255, 0.08);

  --fg: #f3f4f6;
  --muted: #9ca3af;
  --bright: #ffffff;

  --font-title: 'Outfit', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-code: 'Fira Code', monospace;
}

/* Theme Accents */
body.theme-cyan { --accent: #38bdf8; --accent-purple: #38bdf8; }
body.theme-emerald { --accent: #34d399; --accent-purple: #34d399; }
body.theme-purple { --accent: #818cf8; --accent-purple: #818cf8; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { max-width: 100%; overflow-x: hidden; }
body {
  background: var(--bg-dark);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}

/* Ambient Lighting Background */
.glow-bg {
  position: fixed;
  top: -10%;
  left: -10%;
  width: 120vw;
  height: 120vh;
  background: radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.15) 0%, transparent 45%),
              radial-gradient(circle at 85% 85%, rgba(56, 189, 248, 0.15) 0%, transparent 45%);
  z-index: -1;
  pointer-events: none;
}

.wrap { max-width: 1280px; margin: 0 auto; padding: 24px 20px 80px; }

/* Hero Dashboard */
.hero {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 24px 32px;
  backdrop-filter: blur(16px);
  margin-bottom: 24px;
}
.hero-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 16px;
}
.brand-title {
  font-family: var(--font-title);
  font-size: 2.2rem;
  font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent-purple), var(--accent-pink));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  display: flex;
  align-items: center;
  gap: 12px;
}
.brand-tag {
  font-size: 0.8rem;
  background: rgba(56, 189, 248, 0.15);
  color: var(--accent);
  border: 1px solid rgba(56, 189, 248, 0.3);
  padding: 3px 10px;
  border-radius: 999px;
  font-family: var(--font-code);
}
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  margin-top: 16px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
}
.stat-num {
  font-family: var(--font-title);
  font-size: 1.8rem;
  font-weight: 800;
  color: var(--accent);
}
.stat-label { font-size: 0.8rem; color: var(--muted); }

/* Controls Panel */
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  backdrop-filter: blur(16px);
  margin-bottom: 24px;
}
.row { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; justify-content: space-between; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 0.8rem; color: var(--muted); }

.search-box-wrap {
  position: relative;
  flex: 1 1 300px;
}
input[type=search] {
  width: 100%;
  padding: 10px 16px 10px 40px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--bright);
  font: inherit;
  font-size: 0.95rem;
  outline: none;
  transition: all 0.2s ease;
}
input[type=search]:focus {
  border-color: var(--accent-purple);
  box-shadow: 0 0 12px rgba(129, 140, 248, 0.3);
}
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
.kbd-hint {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  font-family: var(--font-code);
  font-size: 0.75rem;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 2px 6px;
  color: var(--muted);
}

select {
  padding: 8px 12px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--bright);
  font: inherit;
  font-size: 0.88rem;
  outline: none;
}

/* Category Checkbox Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chips label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--bg-card);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s ease;
}
.chips label:hover, .chips input:checked + span {
  border-color: var(--accent);
  color: var(--bright);
}
.chips input { display: none; }
.chips input:checked + span { font-weight: 600; color: var(--accent); }

label.check { display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; cursor: pointer; }

/* View Mode Switcher */
.view-switcher {
  display: flex;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 3px;
  gap: 2px;
}
.view-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  padding: 6px 14px;
  border-radius: 8px;
  font: inherit;
  font-size: 0.85rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
}
.view-btn.active {
  background: var(--accent-purple);
  color: var(--bright);
}

/* Theme Picker */
.theme-picker {
  display: flex;
  gap: 6px;
  align-items: center;
}
.theme-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform 0.2s ease;
}
.theme-dot:hover { transform: scale(1.2); }
.theme-dot.purple { background: #818cf8; }
.theme-dot.cyan { background: #38bdf8; }
.theme-dot.emerald { background: #34d399; }

/* Pulsating Animation for Soon Deadlines */
@keyframes pulseGlow {
  0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4); }
  70% { box-shadow: 0 0 0 8px rgba(251, 191, 36, 0); }
  100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0); }
}

/* Buttons */
button {
  font: inherit; font-size: 0.85rem; padding: 6px 12px;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg-card); color: var(--fg); cursor: pointer;
  transition: all 0.2s ease;
}
button:hover { border-color: var(--accent-purple); color: var(--bright); }
.btn-reset { background: rgba(251, 113, 133, 0.15); color: var(--warn); border-color: rgba(251, 113, 133, 0.3); }

/* Feeds */
.feeds { display: flex; flex-wrap: wrap; gap: 10px; }
.feed {
  display: inline-flex; align-items: center; gap: 8px;
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px;
  background: var(--bg-card);
}
.feed code { font-family: var(--font-code); font-size: 0.82rem; color: var(--muted); }

/* Table View */
.count { color: var(--muted); font-size: 0.88rem; margin: 12px 0; }
.tablewrap {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow-x: auto;
  backdrop-filter: blur(16px);
}
table { border-collapse: collapse; width: 100%; min-width: 900px; }
th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
th {
  background: rgba(0, 0, 0, 0.5);
  font-family: var(--font-title);
  font-weight: 700;
  font-size: 0.82rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
tr { cursor: pointer; transition: background 0.15s ease; }
tr:hover td { background: var(--bg-card-hover); }

.conf { font-weight: 700; font-family: var(--font-title); font-size: 1.05rem; }
.conf a { color: var(--accent); text-decoration: none; }
.conf a:hover { text-decoration: underline; }
.sub { color: var(--muted); font-size: 0.82rem; }
.nowrap { white-space: nowrap; }
.left { font-weight: 600; font-family: var(--font-code); }
.left.past { color: var(--muted); font-weight: 400; }
.left.soon { color: var(--accent-amber); animation: pulseGlow 2s infinite; border-radius: 4px; padding: 2px 6px; }
.left.today { color: var(--warn); font-weight: 700; }

.tag {
  display: inline-block; padding: 2px 8px; border-radius: 6px;
  background: var(--chip); font-size: 0.75rem; color: var(--muted); margin-right: 4px;
  border: 1px solid var(--line);
}
.tag.est { color: var(--accent-amber); border-color: rgba(251, 191, 36, 0.3); background: rgba(251, 191, 36, 0.1); }

/* Grid Cards View */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}
.card-item {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  backdrop-filter: blur(16px);
  cursor: pointer;
  transition: all 0.2s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.card-item:hover {
  border-color: var(--accent-purple);
  transform: translateY(-3px);
  background: var(--bg-card-hover);
}

/* Timeline View & Month Grid Widget */
.timeline-wrap { display: flex; flex-direction: column; gap: 24px; }
.month-calendar-widget {
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 24px;
}
.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  text-align: center;
  margin-top: 12px;
}
.cal-day-header { font-family: var(--font-title); font-size: 0.8rem; color: var(--muted); font-weight: 700; }
.cal-day-cell {
  background: var(--bg-card);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 8px 4px;
  font-family: var(--font-code);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s ease;
  min-height: 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
}
.cal-day-cell:hover { border-color: var(--accent); background: var(--bg-card-hover); }
.dot-wrap { display: flex; gap: 3px; margin-top: 2px; }
.dot { width: 6px; height: 6px; border-radius: 50%; }
.dot.paper { background: var(--warn); }
.dot.event { background: var(--accent); }

/* Drawer Modal */
.drawer-overlay {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(10, 13, 20, 0.75);
  backdrop-filter: blur(8px);
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
.drawer-overlay.active { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed;
  top: 0; right: -520px; width: 500px; max-width: 90vw; height: 100vh;
  background: #0d121f;
  border-left: 1px solid var(--line);
  z-index: 101;
  padding: 32px;
  overflow-y: auto;
  box-shadow: -10px 0 40px rgba(0,0,0,0.6);
  transition: right 0.3s cubic-bezier(0.16, 1, 0.3, 1);
}
.drawer-overlay.active .drawer { right: 0; }

/* Toast Notifications */
.toast {
  position: fixed;
  bottom: 30px; right: 30px;
  background: var(--accent-purple);
  color: #fff;
  padding: 12px 20px;
  border-radius: 10px;
  font-weight: 600;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  transform: translateY(100px);
  opacity: 0;
  transition: all 0.3s ease;
  z-index: 200;
}
.toast.show { transform: translateY(0); opacity: 1; }
</style>
</head>
<body class="theme-purple">

<div class="glow-bg"></div>

<div class="wrap">
  <!-- Hero Section -->
  <header class="hero">
    <div class="hero-top">
      <div>
        <div class="brand-title">
          <span>cfp-radar</span>
          <span class="brand-tag">v2.0 Autonomous</span>
        </div>
        <p class="lead" style="margin-top: 4px;">高性能計算・ネットワーク・システム・人工知能・セキュリティ分野の会議の投稿締切と開催日。<span id="genat"></span></p>
      </div>

      <div style="display: flex; gap: 16px; align-items: center;">
        <div class="theme-picker">
          <span style="font-size: 0.75rem; color: var(--muted);">テーマ:</span>
          <div class="theme-dot purple" onclick="setTheme('purple')" title="Cyber Purple"></div>
          <div class="theme-dot cyan" onclick="setTheme('cyan')" title="Neon Cyan"></div>
          <div class="theme-dot emerald" onclick="setTheme('emerald')" title="Emerald Matrix"></div>
        </div>
      </div>
    </div>

    <!-- Live Statistics Dashboard -->
    <div class="stats-grid">
      <div class="stat-card">
        <span class="stat-num" id="statConfs">--</span>
        <span class="stat-label">追跡会議・ワークショップ数</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" style="color: var(--accent-purple);" id="statUpcoming">--</span>
        <span class="stat-label">直近30日以内の締切</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" style="color: var(--accent-pink);" id="statNiche">--</span>
        <span class="stat-label">自律探知穴場・特化ジャーナル</span>
      </div>
      <div class="stat-card">
        <span class="stat-num" style="color: var(--accent-emerald);" id="statDomestic">--</span>
        <span class="stat-label">国内研究会・国内シンポジウム</span>
      </div>
    </div>
  </header>

  <section>
    <h2 style="font-family: var(--font-title); color: var(--accent-purple); margin-bottom: 12px;">📡 購読カレンダーフィード (ICS Feeds)</h2>
    <div class="panel feeds" id="feeds"></div>
  </section>

  <section>
    <div class="panel">
      <div class="row" style="margin-bottom:14px">
        <div class="search-box-wrap">
          <span class="search-icon">🔍</span>
          <input type="search" id="q" placeholder="文字列検索 (例: nsdi, MobiCom, Denver)...">
          <span class="kbd-hint">⌘K</span>
        </div>
        <div class="field">
          <span>種別（締切・開催）</span>
          <select id="kind"></select>
        </div>
        <div class="field">
          <span>ランク</span>
          <select id="rank"></select>
        </div>
        <div class="field">
          <span>期間</span>
          <select id="win">
            <option value="all">すべて</option>
            <option value="future">未来のみ</option>
            <option value="30d">直近 30 日以内</option>
            <option value="90d">直近 90 日以内</option>
            <option value="180d">直近 180 日以内</option>
          </select>
        </div>
        <div class="view-switcher">
          <button class="view-btn active" id="btnViewTable" onclick="switchView('table')">📊 表</button>
          <button class="view-btn" id="btnViewCards" onclick="switchView('cards')">🃏 カード</button>
          <button class="view-btn" id="btnViewTimeline" onclick="switchView('timeline')">📅 タイムライン</button>
        </div>
        <button class="btn-reset" id="reset">条件クリア</button>
      </div>

      <div class="field">
        <span>分野（複数選択可。空ならすべて）</span>
        <div class="chips" id="cats"></div>
      </div>

      <div class="row" style="margin-top:14px">
        <label class="check"><input type="checkbox" id="domestic"> <span>国内研究会・国内シンポジウムのみ</span></label>
        <label class="check"><input type="checkbox" id="est"> <span>推定締切を含める</span></label>
        <label class="check"><input type="checkbox" id="past"> <span>過去の締切も含める</span></label>
      </div>
    </div>
  </section>

  <div class="count" id="count"></div>

  <!-- Multi-View Containers -->
  <div id="viewContainer">
    <!-- Table View -->
    <div class="tablewrap" id="tableView">
      <table>
        <thead>
          <tr>
            <th>残り</th>
            <th>日時</th>
            <th>会議</th>
            <th>種別</th>
            <th>ランク</th>
            <th>会期</th>
            <th>開催地</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>

    <!-- Cards Grid View -->
    <div class="cards-grid" id="cardsView" style="display: none;"></div>

    <!-- Timeline View -->
    <div class="timeline-wrap" id="timelineView" style="display: none;"></div>
  </div>

  <div class="empty" id="empty" hidden>該当する締切はありません。</div>
  <div style="margin-top: 16px; text-align: center;"><button id="more">さらに表示</button></div>

  <footer style="margin-top: 48px; border-top: 1px solid var(--line); padding-top: 16px; color: var(--muted); font-size: 0.85rem;">
    <div>データ源: <span id="sources">-</span></div>
    <div id="repolink"><a href="https://github.com/ten82e/cfp-radar" style="color: var(--accent);">GitHub リポジトリ</a></div>
  </footer>
</div>

<!-- Slide Drawer Modal -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer(event)">
  <div class="drawer" id="drawer">
    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
      <div>
        <h2 id="drawerTitle" style="font-family: var(--font-title); font-size: 1.8rem; color: var(--bright);"></h2>
        <div id="drawerTags" style="margin-top: 8px;"></div>
      </div>
      <button onclick="closeDrawer()" style="background: rgba(255,255,255,0.1); border: none; font-size: 1.1rem; padding: 4px 10px;">✕</button>
    </div>
    <p id="drawerFullName" style="color: var(--muted); margin-bottom: 24px; font-size: 0.95rem;"></p>
    <div id="drawerBody"></div>
  </div>
</div>

<div class="toast" id="toast">コピーしました！</div>

<script>
(function () {
  // SPEC.md section 7: DATA is injected by build.py. Defaults to empty so that
  // opening the template standalone displays a blank table instead of throwing.
  var DATA = /*__DATA__*/null;
  if (!DATA) {
    DATA = { generated_at: "", sources: [], categories: {}, conferences: [] };
  }

  var DAY = 86400000;
  var PAGE = 40;
  var currentViewMode = "table";

  var KIND_LABEL = {
    abstract: "概要締切",
    paper: "論文締切",
    supplementary: "補足資料締切",
    notification: "採否通知",
    camera_ready: "カメラレディ締切",
    rebuttal_start: "反論期間開始",
    rebuttal_end: "反論期間終了",
    review_release: "査読結果公開",
    registration: "登録締切",
    event: "開催",
    other: "締切"
  };

  var state = {
    q: "", cats: [], kind: "", rank: "", win: "all",
    est: false, past: false, domestic: false
  };

  function $(id) { return document.getElementById(id); }

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  function fmtDate(d) {
    return d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1) + "-" + pad(d.getUTCDate()) + " " +
      pad(d.getUTCHours()) + ":" + pad(d.getUTCMinutes());
  }

  function fmtJst(d) {
    var jst = new Date(d.getTime() + 9 * 3600000);
    return jst.getUTCFullYear() + "-" + pad(jst.getUTCMonth() + 1) + "-" + pad(jst.getUTCDate()) + " " +
      pad(jst.getUTCHours()) + ":" + pad(jst.getUTCMinutes()) + " JST";
  }

  function catLabel(key) {
    return (DATA.categories && DATA.categories[key]) ? key.toUpperCase() : key;
  }

  // ---- UI Controls ----
  window.setTheme = function(theme) {
    document.body.className = "theme-" + theme;
  };

  window.switchView = function(mode) {
    currentViewMode = mode;
    ["Table", "Cards", "Timeline"].forEach(function(m) {
      var btn = $("btnView" + m);
      if (btn) btn.classList.toggle("active", m.toLowerCase() === mode);
    });
    $("tableView").style.display = mode === "table" ? "block" : "none";
    $("cardsView").style.display = mode === "cards" ? "grid" : "none";
    $("timelineView").style.display = mode === "timeline" ? "flex" : "none";
    render();
  };

  window.openDrawer = function(r) {
    $("drawerOverlay").classList.add("active");
    $("drawerTitle").textContent = (r.conf.title || r.conf.key) + " " + (r.ed.year || "");
    $("drawerFullName").textContent = r.conf.full_name || "";

    var tagsHtml = (r.cats || []).map(function(c) {
      return '<span class="tag">' + c.toUpperCase() + '</span>';
    }).join("") + (r.rankPairs || []).map(function(p) {
      return '<span class="tag" style="border-color: var(--accent-purple); color: var(--accent-purple);">' + p.toUpperCase() + '</span>';
    }).join("");
    $("drawerTags").innerHTML = tagsHtml;

    var bodyHtml = '<div style="background: rgba(255,255,255,0.04); padding: 16px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--line);">' +
      '<div style="font-size: 0.85rem; color: var(--muted); margin-bottom: 4px;">種別 / 締切</div>' +
      '<div style="font-family: var(--font-title); font-size: 1.2rem; font-weight: 700; color: var(--accent-amber);">' + (KIND_LABEL[r.kind] || r.kind) + '</div>' +
      '<div style="font-family: var(--font-code); font-size: 0.9rem; margin-top: 6px;">' + fmtDate(new Date(r.t)) + ' UTC (' + fmtJst(new Date(r.t)) + ')</div>' +
      '</div>';

    if (r.conf.link || r.ed.link) {
      bodyHtml += '<a href="' + (r.ed.link || r.conf.link) + '" target="_blank" style="display: block; width: 100%; text-align: center; background: var(--accent-purple); color: #fff; text-decoration: none; padding: 10px; border-radius: 8px; font-weight: 600; margin-bottom: 24px;">公式サイトを開く ↗</a>';
    }

    bodyHtml += '<h3 style="font-family: var(--font-title); font-size: 1.1rem; color: var(--accent); margin-bottom: 12px;">開催情報</h3>' +
      '<p><strong>会期:</strong> ' + (r.ed.date_text || r.ed.event_start || "未定") + '</p>' +
      '<p><strong>開催地:</strong> ' + (r.ed.place || "未定") + '</p>';

    $("drawerBody").innerHTML = bodyHtml;
  };

  window.closeDrawer = function(e) {
    if (!e || e.target === $("drawerOverlay") || e.target.tagName === "BUTTON") {
      $("drawerOverlay").classList.remove("active");
    }
  };

  window.copyToClipboard = function(text) {
    navigator.clipboard.writeText(text).then(function() {
      var t = $("toast");
      if (t) {
        t.classList.add("show");
        setTimeout(function() { t.classList.remove("show"); }, 2000);
      }
    });
  };

  // ---- FEEDS ----
  var feedsBox = $("feeds");
  var FEEDS = [
    { name: "全フィード", file: "all.ics" },
    { name: "HPC", file: "hpc.ics" },
    { name: "Networking", file: "networking.ics" },
    { name: "Systems", file: "systems.ics" },
    { name: "AI", file: "ai.ics" },
    { name: "Security", file: "security.ics" },
    { name: "締切のみ", file: "deadlines.ics" },
    { name: "開催のみ", file: "events.ics" }
  ];
  var siteBase = ((DATA.site || {}).base_url || "").replace(/\/$/, "");

  FEEDS.forEach(function (f) {
    var url = (siteBase ? siteBase + "/" : "") + f.file;
    var div = document.createElement("div");
    div.className = "feed";
    div.innerHTML = '<strong>' + f.name + '</strong>' +
      '<button onclick="copyToClipboard(\'' + url + '\')">URL コピー</button>';
    feedsBox.appendChild(div);
  });

  // ---- CATEGORIES ----
  var catsBox = $("cats");
  Object.keys(DATA.categories || {}).forEach(function (k) {
    var lbl = document.createElement("label");
    var chk = document.createElement("input");
    chk.type = "checkbox"; chk.value = k;
    lbl.appendChild(chk);
    var span = document.createElement("span");
    span.textContent = k.toUpperCase() + " (" + DATA.categories[k] + ")";
    lbl.appendChild(span);
    catsBox.appendChild(lbl);
  });

  // ---- SELECTS ----
  var kindSel = $("kind");
  var optAllK = document.createElement("option");
  optAllK.value = ""; optAllK.textContent = "すべて";
  kindSel.appendChild(optAllK);
  Object.keys(KIND_LABEL).forEach(function (k) {
    var opt = document.createElement("option");
    opt.value = k; opt.textContent = KIND_LABEL[k];
    kindSel.appendChild(opt);
  });

  var rankSel = $("rank");
  var optAllR = document.createElement("option");
  optAllR.value = ""; optAllR.textContent = "すべて";
  rankSel.appendChild(optAllR);
  ["A*", "A", "B", "C", "N"].forEach(function (r) {
    var opt = document.createElement("option");
    opt.value = r; opt.textContent = "Rank " + r;
    rankSel.appendChild(opt);
  });

  // ---- DATA FLATTENING ----
  var rows = [];
  (DATA.conferences || []).forEach(function (conf) {
    (conf.editions || []).forEach(function (e) {
      var pairs = [];
      if (conf.rank) {
        Object.keys(conf.rank).forEach(function (rk) {
          if (conf.rank[rk]) { pairs.push(rk + ":" + conf.rank[rk]); }
        });
      }
      var baseHay = [
        conf.title, conf.full_name, conf.key, e.place, e.date_text
      ].filter(Boolean).join(" ").toLowerCase();

      (e.deadlines || []).forEach(function (dl) {
        var t = Date.parse(dl.utc);
        if (isNaN(t)) return;
        rows.push({
          conf: conf, ed: e, dl: dl,
          kind: dl.kind, est: e.estimated,
          t: t, tLast: t,
          cats: conf.categories || [],
          tags: conf.tags || [],
          rankPairs: pairs,
          hay: baseHay + " " + (dl.label || "") + " " + dl.kind,
          dupLabel: dl.comment || ""
        });
      });

      if (e.event_start) {
        var tStart = Date.parse(e.event_start + "T00:00:00Z");
        var tEnd = e.event_end ? Date.parse(e.event_end + "T00:00:00Z") : tStart;
        if (!isNaN(tStart)) {
          rows.push({
            conf: conf, ed: e, dl: null,
            kind: "event", est: e.estimated,
            t: tStart, tLast: isNaN(tEnd) ? tStart : tEnd,
            cats: conf.categories || [],
            tags: conf.tags || [],
            rankPairs: pairs,
            hay: baseHay,
            dupLabel: ""
          });
        }
      }
    });
  });

  // Update Stats Dashboard
  $("statConfs").textContent = (DATA.conferences || []).length;
  var nowMs = Date.now();
  var next30 = rows.filter(function(r) { return r.t >= nowMs && (r.t - nowMs) <= 30*DAY; }).length;
  $("statUpcoming").textContent = next30;
  var nicheCount = (DATA.conferences || []).filter(function(c) { return (c.tags || []).indexOf("niche") !== -1; }).length;
  $("statNiche").textContent = nicheCount;
  var domCount = (DATA.conferences || []).filter(function(c) { return (c.tags || []).indexOf("domestic-jp") !== -1; }).length;
  $("statDomestic").textContent = domCount;

  // ---- REMAIN / STATUS ----
  function remain(ms) {
    var diff = ms - Date.now();
    if (diff < 0) {
      var pd = Math.floor(-diff / DAY);
      return { text: pd === 0 ? "本日終了" : pd + " 日前に終了", cls: "past" };
    }
    var d = Math.floor(diff / DAY);
    if (d === 0) {
      var h = Math.floor(diff / 3600000);
      return { text: h <= 0 ? "まもなく" : "あと " + h + " 時間", cls: "today" };
    }
    return { text: "あと " + d + " 日", cls: d <= 14 ? "soon" : "" };
  }

  function remainEvent(r) {
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var t0 = today.getTime();
    var days = function (a, b) { return Math.round((a - b) / DAY); };
    if (t0 < r.t) {
      var n = days(r.t, t0);
      return { text: "あと " + n + " 日", cls: n <= 14 ? "soon" : "" };
    }
    if (t0 === r.t) { return { text: "本日開催", cls: "today" }; }
    if (t0 <= r.tLast) {
      return { text: "開催中（残り " + (days(r.tLast, t0) + 1) + " 日）", cls: "today" };
    }
    return { text: days(t0, r.tLast) + " 日前に終了", cls: "past" };
  }

  // ---- FILTERING ----
  function filter() {
    var now = Date.now();
    var q = state.q.toLowerCase();
    var limit = state.win === "all" ? Infinity : now + parseInt(state.win, 10) * DAY;
    return rows.filter(function (r) {
      if (!state.est && r.est) { return false; }
      if (!state.past && (r.kind === "event" ? now >= r.tLast + DAY : r.t < now)) {
        return false;
      }
      if (r.t > limit) { return false; }
      if (state.kind && r.kind !== state.kind) { return false; }
      if (state.rank && r.rankPairs.indexOf(state.rank) < 0) { return false; }
      if (state.cats.length) {
        var hit = false;
        for (var i = 0; i < state.cats.length; i++) {
          if (r.cats.indexOf(state.cats[i]) >= 0) { hit = true; break; }
        }
        if (!hit) { return false; }
      }
      if (state.domestic && (r.tags || []).indexOf("domestic-jp") < 0) { return false; }
      if (q && r.hay.indexOf(q) < 0) { return false; }
      return true;
    });
  }

  // ---- RENDERING ----
  var shown = [];
  var drawn = 0;

  function td(tr, label, cls) {
    var e = document.createElement("td");
    if (label) { e.setAttribute("data-label", label); }
    if (cls) { e.className = cls; }
    tr.appendChild(e);
    return e;
  }

  function line(parent, text, cls) {
    if (!text) { return null; }
    var d = document.createElement("div");
    if (cls) { d.className = cls; }
    d.textContent = text;
    parent.appendChild(d);
    return d;
  }

  function makeRow(r) {
    var tr = document.createElement("tr");
    tr.onclick = function(e) {
      if (e.target.tagName !== "A") { openDrawer(r); }
    };
    var isEvent = r.kind === "event";
    var rem = isEvent ? remainEvent(r) : remain(r.t);

    var c0 = td(tr, "", "c-deadline");
    line(c0, rem.text, "left " + rem.cls);

    var c1 = td(tr, "日時");
    if (isEvent) {
      line(c1, r.ed.event_start || "-", "nowrap");
    } else {
      var d = new Date(r.t);
      line(c1, fmtDate(d) + " UTC", "nowrap");
      line(c1, fmtJst(d), "sub nowrap");
    }

    var c2 = td(tr, "会議");
    var head = document.createElement("div");
    head.className = "conf";
    var name = (r.conf.title || r.conf.key || "") + " " + (r.ed.year || "");
    var href = r.ed.link || r.conf.link;
    if (href) {
      var a = document.createElement("a");
      a.href = href; a.textContent = name.trim();
      a.rel = "noopener noreferrer"; a.target = "_blank";
      head.appendChild(a);
    } else {
      head.textContent = name.trim();
    }
    c2.appendChild(head);
    if (r.conf.full_name && r.conf.full_name !== r.conf.title) {
      line(c2, r.conf.full_name, "sub");
    }
    var tags = document.createElement("div");
    r.cats.forEach(function (k) {
      var s = document.createElement("span");
      s.className = "tag"; s.textContent = catLabel(k);
      tags.appendChild(s);
    });
    if (r.est) {
      var es = document.createElement("span");
      es.className = "tag est"; es.textContent = "推定";
      tags.appendChild(es);
    }
    if ((r.tags || []).indexOf("domestic-jp") >= 0) {
      var dj = document.createElement("span");
      dj.className = "tag"; dj.textContent = "国内";
      tags.appendChild(dj);
    }
    if (tags.childNodes.length) { c2.appendChild(tags); }

    var c3 = td(tr, "種別");
    line(c3, (KIND_LABEL[r.kind] || r.kind) + (r.dupLabel ? ": " + r.dupLabel : ""));
    var detail = [];
    if (isEvent) {
      if (r.ed.date_text) { detail.push(r.ed.date_text); }
    } else {
      if (r.dl.round && r.dl.round > 1) { detail.push("第 " + r.dl.round + " ラウンド"); }
      if (r.dl.label) { detail.push(r.dl.label); }
    }
    if (detail.length) { line(c3, detail.join(" / "), "sub"); }

    var c4 = td(tr, "ランク");
    if (r.rankPairs.length) {
      r.rankPairs.forEach(function (p) {
        var s = p.split(":");
        var e = document.createElement("span");
        e.className = "tag";
        e.textContent = s[0].toUpperCase() + " " + s[1];
        c4.appendChild(e);
      });
    } else {
      line(c4, "-", "sub");
    }

    var c5 = td(tr, "会期");
    var span = "-";
    if (r.ed.event_start) {
      span = r.ed.event_end && r.ed.event_end !== r.ed.event_start
        ? r.ed.event_start + " 〜 " + r.ed.event_end
        : r.ed.event_start;
    }
    line(c5, span, "sub nowrap");

    var c6 = td(tr, "開催地");
    line(c6, r.ed.place || "-", "sub");

    return tr;
  }

  function renderCards(slice) {
    var container = $("cardsView");
    container.innerHTML = "";
    slice.forEach(function(r) {
      var card = document.createElement("div");
      card.className = "card-item";
      card.onclick = function() { openDrawer(r); };

      var isEvent = r.kind === "event";
      var rem = isEvent ? remainEvent(r) : remain(r.t);

      card.innerHTML = '<div>' +
        '<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">' +
        '<span style="font-family: var(--font-code); font-size: 0.75rem; color: var(--accent);">' + (r.cats || []).join(", ").toUpperCase() + '</span>' +
        '<span class="tag" style="color: var(--accent-purple); border-color: var(--accent-purple);">' + (r.rankPairs[0] ? r.rankPairs[0].toUpperCase() : "Niche") + '</span>' +
        '</div>' +
        '<h3 style="font-family: var(--font-title); font-size: 1.3rem; margin-bottom: 4px; color: var(--bright);">' + (r.conf.title || r.conf.key) + ' ' + (r.ed.year || '') + '</h3>' +
        '<p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 16px;">' + (r.conf.full_name || '') + '</p>' +
        '</div>' +
        '<div style="border-top: 1px solid var(--line); padding-top: 12px; display: flex; justify-content: space-between; align-items: center;">' +
        '<div><span style="font-size: 0.8rem; color: var(--muted);">' + (KIND_LABEL[r.kind] || r.kind) + '</span><br><strong style="font-family: var(--font-code); font-size: 0.9rem;">' + (isEvent ? r.ed.event_start : fmtDate(new Date(r.t)).substring(0, 10)) + '</strong></div>' +
        '<span class="left ' + rem.cls + '" style="font-size: 0.85rem;">' + rem.text + '</span>' +
        '</div>';
      container.appendChild(card);
    });
  }

  function renderTimeline(slice) {
    var container = $("timelineView");
    container.innerHTML = "";

    // Render Month Calendar Grid
    var calWidget = document.createElement("div");
    calWidget.className = "month-calendar-widget";
    var daysHeader = ['日', '月', '火', '水', '木', '金', '土'].map(function(d) {
      return '<div class="cal-day-header">' + d + '</div>';
    }).join("");

    var daysGrid = "";
    for (var d = 1; d <= 31; d++) {
      daysGrid += '<div class="cal-day-cell"><span>' + d + '</span><div class="dot-wrap"><div class="dot paper"></div><div class="dot event"></div></div></div>';
    }

    calWidget.innerHTML = '<div style="font-family: var(--font-title); font-weight: 700; color: var(--accent); margin-bottom: 8px;">月間アクティビティカレンダー (2026年8月)</div><div class="calendar-grid">' + daysHeader + daysGrid + '</div>';
    container.appendChild(calWidget);

    var groups = {};
    slice.forEach(function(r) {
      var d = new Date(r.t);
      var m = d.getUTCFullYear() + "-" + pad(d.getUTCMonth() + 1);
      if (!groups[m]) groups[m] = [];
      groups[m].push(r);
    });

    Object.keys(groups).sort().forEach(function(m) {
      var grp = document.createElement("div");
      grp.className = "timeline-group";
      grp.innerHTML = '<div class="timeline-header">' + m + '</div>';
      groups[m].forEach(function(r) {
        var item = document.createElement("div");
        item.style.padding = "14px 18px";
        item.style.background = "var(--bg-panel)";
        item.style.border = "1px solid var(--line)";
        item.style.borderRadius = "12px";
        item.style.marginBottom = "10px";
        item.style.cursor = "pointer";
        item.onclick = function() { openDrawer(r); };

        var rem = r.kind === "event" ? remainEvent(r) : remain(r.t);
        item.innerHTML = '<div style="display: flex; justify-content: space-between; align-items: center;">' +
          '<div><strong style="color: var(--bright);">' + (r.conf.title || r.conf.key) + ' ' + (r.ed.year || '') + '</strong> — <span style="color: var(--accent);">' + (KIND_LABEL[r.kind] || r.kind) + '</span></div>' +
          '<span class="left ' + rem.cls + '" style="font-size: 0.85rem;">' + rem.text + '</span>' +
          '</div>';
        grp.appendChild(item);
      });
      container.appendChild(grp);
    });
  }

  function drawMore() {
    var tbody = $("tbody");
    var end = Math.min(drawn + PAGE, shown.length);
    var slice = shown.slice(0, end);

    if (currentViewMode === "table") {
      var frag = document.createDocumentFragment();
      for (var i = drawn; i < end; i++) { frag.appendChild(makeRow(shown[i])); }
      tbody.appendChild(frag);
    } else if (currentViewMode === "cards") {
      renderCards(slice);
    } else if (currentViewMode === "timeline") {
      renderTimeline(slice);
    }

    drawn = end;
    var btn = $("more");
    if (drawn < shown.length) {
      btn.hidden = false;
      btn.textContent = "さらに表示 (残り " + (shown.length - drawn) + " 件)";
    } else {
      btn.hidden = true;
    }
  }

  function render() {
    shown = filter();
    drawn = 0;
    $("tbody").textContent = "";
    $("count").textContent = shown.length + " 件 / 全 " + rows.length + " 件";
    $("empty").hidden = shown.length > 0;
    drawMore();
  }

  function readUrl() {
    var p = new URLSearchParams(window.location.search);
    state.q = p.get("q") || "";
    state.kind = p.get("kind") || "";
    state.rank = p.get("rank") || "";
    state.win = p.get("win") || "all";
    state.est = p.get("est") === "1";
    state.past = p.get("past") === "1";
    state.domestic = p.get("domestic") === "1";
    state.cats = (p.get("cats") || "").split(",").filter(Boolean);
  }

  function writeUrl() {
    var p = new URLSearchParams();
    if (state.q) p.set("q", state.q);
    if (state.kind) p.set("kind", state.kind);
    if (state.rank) p.set("rank", state.rank);
    if (state.win !== "all") p.set("win", state.win);
    if (state.est) p.set("est", "1");
    if (state.past) p.set("past", "1");
    if (state.domestic) p.set("domestic", "1");
    if (state.cats.length) p.set("cats", state.cats.join(","));
    var str = p.toString();
    history.replaceState(null, "", str ? "?" + str : window.location.pathname);
  }

  function toForm() {
    $("q").value = state.q;
    $("kind").value = state.kind;
    $("rank").value = state.rank;
    $("win").value = state.win;
    $("est").checked = state.est;
    $("past").checked = state.past;
    $("domestic").checked = state.domestic;
    Array.prototype.forEach.call(catsBox.querySelectorAll("input"), function (chk) {
      chk.checked = state.cats.indexOf(chk.value) >= 0;
    });
  }

  function fromForm() {
    state.q = $("q").value;
    state.kind = $("kind").value;
    state.rank = $("rank").value;
    state.win = $("win").value;
    state.est = $("est").checked;
    state.past = $("past").checked;
    state.domestic = $("domestic").checked;
    state.cats = [];
    Array.prototype.forEach.call(catsBox.querySelectorAll("input"), function (chk) {
      if (chk.checked) state.cats.push(chk.value);
    });
  }

  function apply() {
    fromForm();
    writeUrl();
    render();
  }

  // Keyboard Shortcuts (⌘K)
  window.addEventListener("keydown", function(e) {
    if ((e.metaKey || e.ctrlKey) && e.key === "k") {
      e.preventDefault();
      $("q").focus();
    }
  });

  // ---- wiring ----
  var timer = null;
  $("q").addEventListener("input", function () {
    clearTimeout(timer);
    timer = setTimeout(apply, 180);
  });
  ["kind", "rank", "win", "est", "past", "domestic"].forEach(function (id) {
    $(id).addEventListener("change", apply);
  });
  catsBox.addEventListener("change", apply);
  $("more").addEventListener("click", drawMore);
  $("reset").addEventListener("click", function () {
    state = { q: "", cats: [], kind: "", rank: "", win: "all", est: false, past: false, domestic: false };
    toForm();
    writeUrl();
    render();
  });

  if (DATA.generated_at) {
    $("genat").textContent = "データ生成: " + DATA.generated_at;
  }
  var srcs = (DATA.sources || []).map(function (s) {
    return s.name + (s.repo ? " (" + s.repo + (s.license ? ", " + s.license : "") + ")" : "");
  });
  $("sources").textContent = srcs.length ? srcs.join(" / ") : "-";

  var localSrc = (DATA.sources || []).filter(function (s) { return s.name === "local"; })[0];
  if (localSrc && localSrc.url) {
    var a = document.createElement("a");
    a.href = localSrc.url;
    a.textContent = "リポジトリ";
    $("repolink").appendChild(document.createTextNode(" / "));
    $("repolink").appendChild(a);
  }

  readUrl();
  toForm();
  render();
})();
</script>
</body>
</html>
